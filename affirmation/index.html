<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Life Design Affirmation</title>

<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500&display=swap" rel="stylesheet">

<style>

* {
    font-family: 'Lexend', sans-serif !important;
}

/* ---------- BASE ---------- */
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: var(--bg);
    transition: all 0.4s ease;
}

/* ---------- THEMES ---------- */
:root {
    --bg: #f5efe6;
    --text: #ff69b4;
    --card: rgba(255,255,255,0.55);
    --border: rgba(255,192,203,0.35);
}

body.theme-pink { --bg:#f5efe6; --text:#ff69b4; --border:rgba(255,105,180,0.25); }
body.theme-lavender { --bg:#f3f0ff; --text:#9b7bff; --border:rgba(155,123,255,0.25); }
body.theme-sage { --bg:#eef5f1; --text:#5fa38b; --border:rgba(95,163,139,0.25); }
body.theme-sky { --bg:#eef6ff; --text:#5aa9ff; --border:rgba(90,169,255,0.25); }
body.theme-beige { --bg:#f5efe6; --text:#d48aa3; --border:rgba(212,138,163,0.25); }

/* ---------- CARD ---------- */
.widget {
    width: 92%;
    max-width: 700px;
    padding: 36px 28px;

    border-radius: 26px;
    background: var(--card);
    backdrop-filter: blur(20px);

    border: 1px solid var(--border);
    box-shadow: 0 10px 30px rgba(0,0,0,0.06);

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;
}

/* ---------- AFFIRMATION (BIGGER) ---------- */
.affirmation {
    font-size: 1.75rem; /* + ~5px bigger feel */
    color: var(--text);
    line-height: 1.6;
    font-weight: 400;
    margin-bottom: 18px;
}

/* ---------- DATE ---------- */
.date {
    font-size: 0.9rem;
    color: var(--text);
    opacity: 0.75;
    margin-bottom: 10px;
}

/* ---------- CLOCK ---------- */
.clock {
    font-size: 1.05rem;
    color: var(--text);
    letter-spacing: 1.5px;
    font-weight: 300;
    margin-bottom: 14px;
}

/* ---------- FOOTER ---------- */
.footer {
    font-size: 0.75rem;
    color: var(--text);
    opacity: 0.65;
    margin-top: 6px;
}

/* ---------- THEME SWITCH ---------- */
.theme-switcher {
    position: fixed;
    bottom: 16px;
    right: 16px;
}

select {
    border: none;
    padding: 8px 10px;
    border-radius: 12px;
    background: rgba(255,255,255,0.6);
    font-family: 'Lexend', sans-serif;
    font-size: 0.75rem;
    outline: none;
    cursor: pointer;
}

</style>
</head>

<body class="theme-pink">

<div class="widget">

    <div class="affirmation" id="affirmation"></div>

    <div class="date" id="date"></div>

    <div class="clock">
        <span id="hour"></span>:<span id="min"></span>:<span id="sec"></span>
    </div>

    <div class="footer">
        made with intention ✿ bypaloma.m
    </div>

</div>

<!-- theme selector -->
<div class="theme-switcher">
    <select onchange="changeTheme(this.value)">
        <option value="theme-pink">Pink</option>
        <option value="theme-lavender">Lavender</option>
        <option value="theme-sage">Sage</option>
        <option value="theme-sky">Sky</option>
        <option value="theme-beige">Beige</option>
    </select>
</div>

<script>

/* ---------- AFFIRMATIONS ---------- */
const affirmations = [
    "I design my life with softness, intention, and clarity.",
    "I am becoming a woman who moves with peace and purpose.",
    "My life reflects my inner alignment and feminine power.",
    "I choose presence, beauty, and intentional creation.",
    "I trust the life I am building, even when it feels slow.",
    "I move with calm confidence and quiet discipline.",
    "Everything I do is shaping a life I deeply love.",
    "I am intentional with my energy, time, and becoming."
];

/* ---------- DAILY LOCK ---------- */
function getDailyAffirmation() {
    const today = new Date();
    const seed = today.getFullYear() + today.getMonth() + today.getDate();
    return affirmations[seed % affirmations.length];
}

function displayAffirmation() {
    document.getElementById("affirmation").innerHTML = getDailyAffirmation();
}

/* ---------- DATE ---------- */
function displayDate(today) {
    const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const months = ["January","February","March","April","May","June",
                    "July","August","September","October","November","December"];

    document.getElementById("date").innerHTML =
        `${days[today.getDay()]}, ${months[today.getMonth()]} ${today.getDate()} ${today.getFullYear()}`;
}

/* ---------- CLOCK ---------- */
function displayClock(today) {
    document.getElementById("hour").innerHTML = format(twelve(today.getHours()));
    document.getElementById("min").innerHTML = format(today.getMinutes());
    document.getElementById("sec").innerHTML = format(today.getSeconds());
}

function twelve(h){ return h>12 ? h-12 : h===0 ? 12 : h; }
function format(n){ return n<10 ? "0"+n : n; }

/* ---------- THEME ---------- */
function changeTheme(theme) {
    document.body.className = theme;
}

/* ---------- LOOP ---------- */
function update() {
    let now = new Date();

    displayAffirmation();
    displayDate(now);
    displayClock(now);

    setTimeout(update, 500);
}

update();

</script>

</body>
</html>
